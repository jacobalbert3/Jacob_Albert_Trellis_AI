services:
  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    image: postgres:${POSTGRESQL_VERSION:-12}
    networks:
      - temporal-network
    ports:
      - 5432:5432
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
  temporal:
    container_name: temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.22.0}
    networks:
      - temporal-network
    ports:
      - 7233:7233
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.22.0}
    networks:
      - temporal-network
    stdin_open: true
    tty: true
  temporal-ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.21.3}
    networks:
      - temporal-network
    ports:
      - 8080:8080
  order-api:
    build: .
    container_name: order-api
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DOCKER_ENV=true
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - temporal-network
    ports:
      - 8000:8000
    command: ["python", "api.py"]
    restart: on-failure
  order-worker:
    build: .
    container_name: order-worker
    depends_on:
      temporal:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DOCKER_ENV=true
    networks:
      - temporal-network
    command: ["python", "main_worker.py"]
    restart: on-failure
networks:
  temporal-network:
    driver: bridge
    name: temporal-network